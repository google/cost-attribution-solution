<div class="title">Configurations</div>

<mat-tab-group dynamicHeight class="full-height">
  <mat-tab>
    <ng-template mat-tab-label>
      General
      <mat-icon class="tab-icon">settings</mat-icon>
    </ng-template>
    <div class="tab-content container full-height"><app-general /></div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      Labels Policies
      <mat-icon class="tab-icon">label_important</mat-icon>
    </ng-template>
    <div class="tab-content container full-height">
      <app-label-policy></app-label-policy>
    </div>
  </mat-tab>

  <mat-tab disabled>
    <ng-template mat-tab-label>
      Tags Policies
      <mat-icon class="tab-icon">beenhere</mat-icon>
    </ng-template>
    <div class="tab-content full-height"></div>
  </mat-tab>
</mat-tab-group>
